# CI — Build, Test, Artifacts, and Release
#
# Jobs
# ----
#   build-loader  – Compiles the loader + execution harness on Ubuntu.
#                   Uploads the resulting binary as a workflow artifact.
#
#   build-payload – Cross-compiles the bare-metal Mach-O payload on macOS.
#                   Uploads the resulting binary as a workflow artifact.
#
#   release       – Runs only when a version tag (v*) is pushed.
#                   Downloads both build artifacts and attaches them as
#                   assets to a new GitHub Release.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  # ---------------------------------------------------------------------------
  # Build: loader + execution harness (Linux)
  # ---------------------------------------------------------------------------
  build-loader:
    name: Build loader (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang

      - name: Build
        run: make loader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macho_loader_test-linux-x86_64
          path: macho_loader_test
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build: bare-metal Mach-O payload (macOS)
  # ---------------------------------------------------------------------------
  build-payload:
    name: Build payload (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make payload

      - name: Verify Mach-O headers
        run: |
          file bare_metal_test
          otool -l bare_metal_test | grep -A4 LC_MAIN

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bare_metal_test-macho-x86_64
          path: bare_metal_test
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: create a GitHub Release and attach assets (tags only)
  # ---------------------------------------------------------------------------
  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build-loader, build-payload]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download loader artifact
        uses: actions/download-artifact@v4
        with:
          name: macho_loader_test-linux-x86_64
          path: dist/

      - name: Download payload artifact
        uses: actions/download-artifact@v4
        with:
          name: bare_metal_test-macho-x86_64
          path: dist/

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PS4 Mach-O Loader ${{ github.ref_name }}"
          body: |
            ## Assets

            | File | Description |
            |------|-------------|
            | `macho_loader_test` | Loader + execution harness (Linux x86-64) |
            | `bare_metal_test` | Bare-metal Mach-O payload (macOS x86-64) |
          files: |
            dist/macho_loader_test
            dist/bare_metal_test
          fail_on_unmatched_files: true
