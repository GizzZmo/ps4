# Build Loader — compile the loader + execution harness on Linux (Ubuntu).
# Uploads the resulting binary as a workflow artifact.
# Badge: https://github.com/GizzZmo/ps4/actions/workflows/build-loader.yml/badge.svg

name: Build Loader

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-loader:
    name: Build loader (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang

      - name: Build
        run: make loader

      - name: Run integration test
        run: make test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macho_loader_test-linux-x86_64
          path: macho_loader_test
          if-no-files-found: error
